server {
    listen 80;
    server_name _;

    # Serve React static files
    root /usr/share/nginx/html;
    index index.html;

    # ── Backend API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:3501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Twitch OAuth initiation + token exchange (backend routes) ────────────
    # These are backend-handled:
    #   /auth/twitch/url     — returns the Twitch authorize URL
    #   /auth/twitch/callback — Twitch redirects here after login (backend handles token exchange)
    #   /auth/me             — verify current session
    #   /auth/logout         — invalidate session
    location ~ ^/auth/(twitch|me|logout) {
        proxy_pass http://backend:3501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (Socket.IO) ─────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://backend:3501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # ── React Router — all other paths serve index.html ──────────────────────
    # This includes /auth/callback (the Twitch redirect goes here as a
    # query string; the backend handles /auth/twitch/callback above)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
